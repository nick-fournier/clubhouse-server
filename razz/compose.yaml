name: razz

# Control plane on the Pi4: the public front door (Cloudflare tunnel) and the
# static hobby sites. No compute-heavy or untrusted-data workloads live here, so
# the sites stay up whatever the workers are doing.
#
# Public hostname -> service routing lives in tunnel.yml.

services:
  # launchpad.nicholasfournier.com: index page + redirects for the old Django paths.
  home:
    image: nginx:1.27-alpine
    container_name: home
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./home/html:/usr/share/nginx/html:ro
      - ./home/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - razz-network

  # fns.nicholasfournier.com (github.com/nick-fournier/sbyc_course_app)
  fns:
    image: nichfournier/fns:latest
    container_name: fns
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - razz-network

  # bvi.nicholasfournier.com (github.com/nick-fournier/bvi_itinerary)
  bvi:
    image: nichfournier/bvi:latest
    container_name: bvi
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - razz-network

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /app/config.yml run
    volumes:
      - ./tunnel.yml:/app/config.yml
    environment:
      - TUNNEL_ID=${TUNNEL_ID}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TZ=${TZ}
    networks:
      - razz-network

  # One-shot: creates the DNS record for each hostname in tunnel.yml, then exits.
  # Runs on every `docker compose up -d`; check with `docker compose logs dns-sync`.
  # The tunnel deliberately doesn't wait on it.
  dns-sync:
    image: alpine:3.20
    container_name: dns-sync
    restart: "no"
    command: sh /dns-sync.sh
    volumes:
      - ./tunnel.yml:/tunnel.yml:ro
      - ./dns-sync.sh:/dns-sync.sh:ro
    environment:
      - TUNNEL_ID=${TUNNEL_ID}
      - CF_API_TOKEN=${CF_API_TOKEN}

networks:
  razz-network:
    driver: bridge
    name: razz-network
