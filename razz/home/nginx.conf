# launchpad.nicholasfournier.com
# Serves the index page, and redirects the old Django launchpad paths to the
# per-app subdomains. Those old URLs are linked from the CV site
# (github.com/nick-fournier/webcv_bibtex, src/data/data.tsx), so keep them
# working. Hostnames are routed in ../tunnel.yml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Behind cloudflared nginx only sees http://; keep local redirects relative.
    absolute_redirect off;

    location = /fns/flags/ {
        return 301 https://fns.nicholasfournier.com/flags.html;
    }

    # /fns, /fns/, /fns/chart-app/ and the retired /fns/gpx/... endpoints
    location ^~ /fns {
        return 301 https://fns.nicholasfournier.com/;
    }

    location ^~ /bvi-itinerary {
        return 301 https://bvi.nicholasfournier.com/;
    }

    # Temporary until the portfolio lab ships (Track B on orange); then change to
    # 301 https://portfolio.nicholasfournier.com/ and add that host to tunnel.yml.
    location ^~ /portfolio-optimizer {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
