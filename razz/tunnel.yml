# NOT APPLIED. The tunnel runs with TUNNEL_TOKEN, so it is remotely managed:
# cloudflared takes its ingress rules from the Cloudflare dashboard
# (Zero Trust -> Networks -> Tunnels -> "orange" -> Public Hostname) and ignores
# this file. Edit routes there; this file mirrors the intended routing until the
# tunnel is switched to a locally managed one (credentials file + this config).
#
# Old launchpad paths (/fns/, /bvi-itinerary/, ...) redirect in home/nginx.conf.
ingress:
  # Static hobby sites, served on razz.
  - hostname: "launchpad.nicholasfournier.com"
    service: http://home:80

  - hostname: "fns.nicholasfournier.com"
    service: http://fns:80

  - hostname: "bvi.nicholasfournier.com"
    service: http://bvi:80

  # Fans out for osrm and motis.
  - hostname: "motis.nicholasfournier.com"
    path: "^/api/.*"
    service: http://thinkbox:8080

  - hostname: "osrm.nicholasfournier.com"
    service: http://orange:5000

  - service: http_status:404
