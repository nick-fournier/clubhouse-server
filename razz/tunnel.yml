# Public hostname -> service. Every public URL in the homelab is listed here.
# DNS: each hostname needs a proxied CNAME -> <TUNNEL_ID>.cfargotunnel.com in Cloudflare
# (it shows as type "Tunnel" there).
# cloudflared only reads this file at startup: `docker compose restart tunnel`
# after editing it.
# Old launchpad paths (/fns/, /bvi-itinerary/, ...) redirect in home/nginx.conf:
# update both together.
ingress:
  # Static hobby sites, served on razz.
  - hostname: "launchpad.nicholasfournier.com"
    service: http://home:80

  - hostname: "fns.nicholasfournier.com"
    service: http://fns:80

  - hostname: "bvi.nicholasfournier.com"
    service: http://bvi:80

  # Portfolio lab dashboard, served from orange over Tailscale.
  - hostname: "portfolio.nicholasfournier.com"
    service: http://orange:8100

  - service: http_status:404
