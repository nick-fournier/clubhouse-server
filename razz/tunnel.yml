# Public hostname -> service. Every public URL in the homelab is listed here.
# Each new hostname also needs a proxied DNS CNAME -> <TUNNEL_ID>.cfargotunnel.com.
# Old launchpad paths (/fns/, /bvi-itinerary/, ...) redirect in home/nginx.conf:
# update both together.
ingress:
  # Static hobby sites, served on razz.
  - hostname: "launchpad.nicholasfournier.com"
    service: http://home:80

  - hostname: "fns.nicholasfournier.com"
    service: http://fns:80

  - hostname: "bvi.nicholasfournier.com"
    service: http://bvi:80

  # Fans out for osrm and motis.
  - hostname: "motis.nicholasfournier.com"
    path: "^/api/.*"
    service: http://thinkbox:8080

  - hostname: "osrm.nicholasfournier.com"
    service: http://orange:5000

  - service: http_status:404
