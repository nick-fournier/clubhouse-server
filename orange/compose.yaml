name: orange

# Compute worker (Orange Pi 5, RK3588). Runs the portfolio lab
# (github.com/nick-fournier/portfolio-lab): one image, two services.
#   portfolio-web   read-only dashboard, public at portfolio.nicholasfournier.com
#                   (razz tunnel -> orange:8100 over Tailscale)
#   portfolio-jobs  scheduler, New York time: a daily chain on trading days at 8 pm (ingest,
#                   hive, forecasts, paper account) and a weekly chain Saturdays at 6 am (EDGAR,
#                   FRED, delisted stocks, price spot check, then the weekly backtests)
# Data lives on the NVMe at /home/nick/portfolio-data, outside this repo: one folder per source
# (alpaca/, sharadar/, edgar/, ...), the derived tables and results; trading/ holds the paper
# account records (operational history, kept apart from market data).

x-portfolio: &portfolio
  image: nichfournier/portfolio-lab:latest
  user: "1001:1001"  # nick on orange, owner of the data directory
  restart: unless-stopped
  environment:
    - PORTFOLIO_DATA_DIR=/data
    - PORTFOLIO_TRADING_DIR=/trading

services:
  portfolio-web:
    <<: *portfolio
    container_name: portfolio-web
    command: plab serve --host 0.0.0.0 --port 8100
    ports:
      - "8100:8100"
    volumes:
      - /home/nick/portfolio-data:/data:ro
      - /home/nick/portfolio-data/trading:/trading:ro
    mem_limit: 1g

  portfolio-jobs:
    <<: *portfolio
    container_name: portfolio-jobs
    command: plab schedule
    env_file: .env  # Alpaca keys; see example.env
    volumes:
      - /home/nick/portfolio-data:/data
      - /home/nick/portfolio-data/trading:/trading
    mem_limit: 10g
    cpus: 6
    healthcheck:
      disable: true  # no HTTP server in this role
